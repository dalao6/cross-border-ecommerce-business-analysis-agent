<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>依伊服饰 AI 跨境电商经营分析智能体</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #0b0f17;
  --panel: #111826;
  --panel-2: #0e1420;
  --border: #1f2a3d;
  --border-soft: #17202f;
  --text: #e6edf3;
  --muted: #8b98ab;
  --muted-2: #5b6779;
  --accent: #38bdf8;
  --accent-2: #818cf8;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #fb7185;
  --violet: #a78bfa;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.6;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* 顶栏 */
.topbar {
  height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--panel);
}
.topbar .logo {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 700; color: #06121f;
}
.topbar .title { font-weight: 600; font-size: 15px; }
.topbar .subtitle { color: var(--muted); font-size: 12px; margin-left: 4px; }
.topbar .tag {
  margin-left: auto; font-size: 11px; color: var(--green);
  border: 1px solid rgba(52,211,153,.3); padding: 2px 10px; border-radius: 20px; background: rgba(52,211,153,.08);
}

/* 主体三栏 */
.main { flex: 1; display: flex; min-height: 0; }

/* 左：对话区 */
.col-chat { flex: 0 0 340px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel-2); }
.chat-head { padding: 14px 16px 8px; font-size: 12px; color: var(--muted); }
.samples { padding: 4px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.sample {
  text-align: left; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--border-soft); color: var(--text);
  font-size: 13px; transition: .15s; white-space: normal;
}
.sample:hover { border-color: var(--accent); color: var(--accent); }
.chat-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; }
.msg.user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121f; }
.bubble {
  padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border-soft);
  font-size: 13px; white-space: pre-wrap; word-break: break-word;
}
.intent-badge {
  display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px; margin-top: 6px;
  border: 1px solid var(--border); color: var(--muted);
}
.intent-badge.hybrid { color: var(--violet); border-color: rgba(167,139,250,.4); }
.intent-badge.external { color: var(--amber); border-color: rgba(251,191,36,.4); }
.intent-badge.internal { color: var(--accent); border-color: rgba(56,189,248,.4); }
.chat-input { flex: 0 0 auto; padding: 12px 16px; border-top: 1px solid var(--border); }
.input-row { display: flex; gap: 8px; }
.chat-input textarea {
  flex: 1; resize: none; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); padding: 10px 12px; font-size: 13px; font-family: inherit;
  min-height: 42px; max-height: 120px; outline: none;
}
.chat-input textarea:focus { border-color: var(--accent); }
.btn-send {
  background: var(--accent); color: #06121f; border: none; border-radius: 10px; padding: 0 16px;
  font-weight: 600; cursor: pointer; font-size: 13px; transition: .15s;
}
.btn-send:hover { filter: brightness(1.1); }
.btn-send:disabled { opacity: .5; cursor: not-allowed; }

/* 中：执行轨迹 */
.col-trace { flex: 0 0 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); overflow-y: auto; }
.trace-head { padding: 16px 18px 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.trace-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); }
.trace-head .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .4; } }
.trace-steps { padding: 4px 10px 20px; }
.step { display: flex; gap: 10px; padding: 7px 8px; border-radius: 8px; align-items: flex-start; }
.step .mark {
  width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; border: 1.5px solid var(--border); color: var(--muted-2); margin-top: 2px;
}
.step.done .mark { background: var(--green); border-color: var(--green); color: #04251a; }
.step.active .mark { border-color: var(--accent); color: var(--accent); }
.step.error .mark { background: var(--red); border-color: var(--red); color: #2a0810; }
.step .s-body { min-width: 0; }
.step .s-title { font-size: 13px; }
.step.done .s-title { color: var(--text); }
.step:not(.done) .s-title { color: var(--muted); }
.step .s-detail { font-size: 11px; color: var(--muted-2); word-break: break-word; margin-top: 2px; }
.step.done .s-detail { color: var(--muted); }

/* 右：结果 */
.col-result { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
.result-empty { color: var(--muted-2); text-align: center; margin-top: 80px; font-size: 13px; }
.section { margin-bottom: 22px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel); }
.section-head {
  padding: 10px 16px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--border-soft); background: var(--panel-2);
}
.section-head .badge { font-size: 11px; padding: 1px 8px; border-radius: 4px; font-weight: 500; }
.badge.internal { background: rgba(56,189,248,.15); color: var(--accent); }
.badge.external { background: rgba(251,191,36,.15); color: var(--amber); }
.badge.marketplace { background: rgba(232,121,249,.15); color: #e879f9; }
.badge.conclusion { background: rgba(167,139,250,.15); color: var(--violet); }
.section-body { padding: 14px 16px; }
.conclusion-text { font-size: 14px; color: var(--text); white-space: pre-wrap; }
.muted-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.uncertain-tag { color: var(--amber); font-size: 12px; border: 1px solid rgba(251,191,36,.35); padding: 1px 8px; border-radius: 4px; margin-right: 6px; }

/* 指标卡 */
.metrics { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.metric-card {
  background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 12px 18px; min-width: 140px;
}
.metric-card .m-label { font-size: 12px; color: var(--muted); }
.metric-card .m-value { font-size: 22px; font-weight: 700; margin-top: 4px; color: var(--accent); }

/* 图表 */
.chart-wrap { height: 300px; margin: 8px 0 4px; }

/* 商品卡片 */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 8px; }
.product-card { background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 14px; transition: .15s; }
.product-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.p-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.p-platform { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
.p-platform.amazon { background: #ff9900; color: #1a1a1a; }
.p-platform.temu  { background: #fb7701; color: #fff; }
.p-platform.ebay  { background: #e53238; color: #fff; }
.p-marketplace { font-size: 11px; color: var(--muted-2); }
.p-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.p-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
.p-meta .k { color: var(--muted-2); }
.p-meta .v { color: var(--text); font-weight: 600; }
.p-meta .v.price { color: var(--green); font-size: 14px; }
.p-meta .v.sales { color: var(--amber); }
.p-tags { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.p-tag { font-size: 10px; padding: 1px 7px; border-radius: 3px; background: rgba(56,189,248,.08); color: var(--accent); border: 1px solid rgba(56,189,248,.2); }
.p-link { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--accent); text-decoration: none; }
.p-link:hover { text-decoration: underline; }
.p-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
.p-detail-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.p-detail-row .lbl { color: var(--muted-2); }
.p-detail-row .val { color: var(--text); }
.p-detail-row .val.ok { color: var(--green); }
.p-detail-row .val.warn { color: var(--amber); }
.p-detail .raw { font-size: 10px; color: var(--muted-2); margin-top: 6px; font-family: "SF Mono", Consolas, monospace; }

/* SQL */
.sql-block { background: #0a0f18; border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.sql-block code { font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 12px; color: #7dd3fc; white-space: pre; }
.sql-head { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }

/* 表格 */
.table-wrap { overflow-x: auto; margin-top: 10px; border: 1px solid var(--border-soft); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
th { background: var(--panel-2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
td { color: var(--text); }
tr:hover td { background: rgba(56,189,248,.04); }

/* 外部来源 */
.src-card { border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel-2); }
.src-title { font-size: 13px; font-weight: 600; color: var(--text); }
.src-meta { font-size: 11px; color: var(--muted-2); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.src-summary { font-size: 12px; color: var(--muted); margin-top: 6px; }
.cred-high { color: var(--green); }
.cred-mid { color: var(--amber); }

/* 加载动画 */
.typing { display: inline-flex; gap: 3px; padding: 4px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }

.scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

@media (max-width: 1100px) {
  .main { flex-direction: column; overflow-y: auto; }
  .col-chat, .col-trace { flex: none; border-right: none; border-bottom: 1px solid var(--border); }
  .col-chat { max-height: 320px; }
  .col-trace { max-height: 260px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">依</div>
    <div class="title">依伊服饰 AI 跨境电商经营分析智能体</div>
    <div class="subtitle">Yiyi AI Cross-Border E-commerce BI Agent</div>
    <div class="tag">数据库驱动 + 外部工具增强</div>
  </div>

  <div class="main">
    <!-- 左：对话 -->
    <div class="col-chat">
      <div class="chat-head">点击示例，或用自然语言提问（无需写 SQL）</div>
      <div class="samples" id="samples"></div>
      <div class="chat-body scrollbar-thin" id="chatBody">
        <div class="msg assistant"><div class="bubble">你好，我是经营分析智能体。我可以查询企业销售、商品、库存、客户、店铺与供应链数据，也能检索行业趋势、平台规则等公开信息并做交叉分析。</div></div>
      </div>
      <div class="chat-input">
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="例如：为什么我们2025年美国市场销量下降？"></textarea>
          <button class="btn-send" id="sendBtn">发送</button>
        </div>
      </div>
    </div>

    <!-- 中：执行轨迹 -->
    <div class="col-trace scrollbar-thin">
      <div class="trace-head"><span class="dot" id="traceDot"></span> Agent 执行轨迹</div>
      <div class="trace-steps" id="traceSteps"></div>
    </div>

    <!-- 右：结果 -->
    <div class="col-result scrollbar-thin" id="result">
      <div class="result-empty">提问后，这里将展示数据图表、SQL 与分析结论。</div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);

const TRACE_DEFS = [
  { key: "received",            label: "接收问题" },
  { key: "intent_detected",     label: "意图识别" },
  { key: "table_recall",        label: "Table Recall · 召回数据表" },
  { key: "schema_recall",       label: "Schema Recall · 召回字段" },
  { key: "metric_recall",       label: "Metric Recall · 召回指标" },
  { key: "sql_generated",       label: "NL2SQL · 生成 SQL" },
  { key: "sql_validated",       label: "SQL 安全校验" },
  { key: "sql_executing",       label: "SQL 执行" },
  { key: "sql_completed",       label: "SQL 执行完成" },
  { key: "external_tool_required", label: "判断需要外部信息" },
  { key: "external_tool_calling",  label: "调用 External Web Search" },
  { key: "external_tool_completed",label: "外部信息获取完成" },
  { key: "result_analysis",     label: "综合分析" },
  { key: "answer_generated",    label: "生成最终答案" },
];

const stepMap = new Map();
let activeStep = null;
let currentSql = "";

function resetTrace() {
  stepMap.clear();
  activeStep = null;
  currentSql = "";
  $("#traceSteps").innerHTML = "";
  $("#traceDot").classList.remove("active");
}

function ensureStep(key, detail) {
  let el = stepMap.get(key);
  if (!el) {
    const div = document.createElement("div");
    div.className = "step";
    const def = TRACE_DEFS.find((d) => d.key === key) || { label: key };
    div.innerHTML = `<div class="mark">✓</div><div class="s-body"><div class="s-title">${def.label}</div><div class="s-detail"></div></div>`;
    $("#traceSteps").appendChild(div);
    el = div;
    stepMap.set(key, el);
  }
  if (detail) el.querySelector(".s-detail").textContent = detail;
  return el;
}

function markStep(key, status, detail) {
  const el = ensureStep(key, detail);
  if (activeStep && stepMap.get(activeStep) === el) activeStep = null;
  el.classList.remove("active", "error", "done");
  if (status === "done") el.classList.add("done");
  else if (status === "error") el.classList.add("error");
  else { el.classList.add("active"); activeStep = key; }
  $("#traceDot").classList.toggle("active", !!activeStep);
}

const INTENT_LABEL = {
  INTERNAL_DATA: "企业内部数据",
  EXTERNAL_INFORMATION: "外部公开信息",
  MARKETPLACE_INTEL: "跨境平台情报",
  HYBRID_ANALYSIS: "混合分析",
};

function handleEvent(e) {
  const name = e.event;
  const status = e.status || "completed";
  if (name === "received") {
    resetTrace();
    markStep("received", "done");
    addUserBubble(currentQuery);
    showAssistantTyping();
    return;
  }
  if (name === "intent_detected") {
    markStep("intent_detected", "done", e.message);
    const intent = e.data && e.data.intent;
    if (intent) {
      const b = document.createElement("div");
      b.className = "intent-badge " + intent.toLowerCase();
      b.textContent = "意图：" + (INTENT_LABEL[intent] || intent);
      $("#chatBody").appendChild(b);
    }
    return;
  }
  if (name === "error") {
    markStep(activeStep || "sql_completed", "error", e.message);
    const b = document.createElement("div");
    b.className = "intent-badge";
    b.textContent = e.message;
    b.style.color = "var(--red)";
    $("#chatBody").appendChild(b);
    removeTyping();
    return;
  }
  if (name === "answer_generated") {
    markStep("answer_generated", "done", e.message);
    removeTyping();
    renderAnswer(e.data.answer);
    return;
  }

  // 中间步骤
  if (name === "sql_generated" && e.data) {
    currentSql = e.data.sql;
    markStep("sql_generated", "done");
  } else if (name === "sql_completed") {
    markStep("sql_completed", status === "error" ? "error" : "done", e.message);
  } else if (name === "external_tool_required") {
    markStep("external_tool_required", "done");
  } else if (name === "external_tool_calling") {
    markStep("external_tool_calling", "done");
  } else if (name === "external_tool_completed") {
    markStep("external_tool_completed", "done", e.message);
  } else if (name === "anomaly_detected") {
    const n = e.data && e.data.anomalies ? e.data.anomalies.length : 0;
    ensureStep("sql_completed").querySelector(".s-detail").textContent += ` ⚠ 检测到 ${n} 处异常波动`;
  } else {
    markStep(name, "done", e.message);
  }
}

let currentQuery = "";
let currentChart = null;

async function ask(query) {
  currentQuery = query;
  resetTrace();
  currentChart && currentChart.dispose && currentChart.dispose();
  currentChart = null;
  $("#result").innerHTML = `<div class="result-empty"><div class="typing"><span></span><span></span><span></span></div><div style="margin-top:10px">正在分析…</div></div>`;
  $("#sendBtn").disabled = true;

  try {
    const resp = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of chunk.split("\n")) {
          if (line.startsWith("data: ")) {
            try { handleEvent(JSON.parse(line.slice(6))); } catch (_) {}
          }
        }
      }
    }
  } catch (err) {
    markStep(activeStep || "received", "error", String(err));
    removeTyping();
  } finally {
    $("#sendBtn").disabled = false;
  }
}

function addUserBubble(q) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble">${escapeHtml(q)}</div>`;
  $("#chatBody").appendChild(div);
  $("#chatBody").scrollTop = $("#chatBody").scrollHeight;
}

function showAssistantTyping() {
  removeTyping();
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.id = "typingMsg";
  div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  $("#chatBody").appendChild(div);
  $("#chatBody").scrollTop = $("#chatBody").scrollHeight;
}
function removeTyping() {
  const t = document.getElementById("typingMsg");
  if (t) t.remove();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderAnswer(answer) {
  const wrap = $("#result");
  wrap.innerHTML = "";
  for (const sec of answer.sections) {
    if (sec.key === "internal") wrap.appendChild(renderInternal(sec));
    else if (sec.key === "external") wrap.appendChild(renderExternal(sec));
    else if (sec.key === "marketplace") wrap.appendChild(renderMarketplace(sec));
    else if (sec.key === "conclusion") wrap.appendChild(renderConclusion(sec));
  }
}

function renderMarketplace(sec) {
  const div = document.createElement("div");
  div.className = "section";
  const backendBadge = sec.backend === "aliyun_opensearch"
    ? '<span style="color:#e879f9;font-size:10px;margin-left:4px">阿里云 OpenSearch</span>'
    : '<span style="color:var(--muted);font-size:10px;margin-left:4px">本地数据</span>';
  let html = `<div class="section-head"><span class="badge marketplace">平台</span>${sec.title}${backendBadge}<span style="margin-left:auto;font-size:11px;color:var(--muted-2)">跨境平台公开商品数据</span></div><div class="section-body">`;
  if (sec.summary) html += `<div class="conclusion-text">${escapeHtml(sec.summary)}</div>`;

  const products = sec.products || [];
  if (products.length) {
    const detailMap = new Map();
    for (const d of sec.details || []) {
      detailMap.set(d.product.url, d.detail);
    }
    html += `<div class="product-grid">`;
    for (const p of products) {
      const det = detailMap.get(p.url);
      const hasDetail = det && det.ok;
      html += `<div class="product-card">`;
      html += `<div class="p-head"><span class="p-platform ${escapeHtml(p.platform)}">${escapeHtml(p.platform)}</span><span class="p-marketplace">${escapeHtml(p.marketplace || "")}</span>${p.is_prime ? '<span style="font-size:10px;color:#ff9900">★ Prime</span>' : ''}</div>`;
      html += `<div class="p-title" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</div>`;
      if (p.brand) html += `<div style="font-size:11px;color:var(--muted-2);margin-top:4px">${escapeHtml(p.brand)}${p.seller ? ' · ' + escapeHtml(p.seller) : ''}</div>`;
      html += `<div class="p-meta">`;
      if (p.price != null) html += `<span><span class="k">价格</span> <span class="v price">${p.currency || ''} ${p.price}</span></span>`;
      if (p.rating != null) html += `<span><span class="k">评分</span> <span class="v">${p.rating}</span></span>`;
      if (p.review_count) html += `<span><span class="k">评论</span> <span class="v">${p.review_count.toLocaleString()}</span></span>`;
      if (p.monthly_sales) html += `<span><span class="k">${escapeHtml(p.monthly_sales_window || "月销")}</span> <span class="v sales">${p.monthly_sales.toLocaleString()}</span></span>`;
      html += `</div>`;
      if (p.sizes && p.sizes.length) {
        html += `<div class="p-tags"><span class="p-tag">尺码: ${p.sizes.map(escapeHtml).join(" / ")}</span>${p.colors && p.colors.length ? `<span class="p-tag">颜色: ${p.colors.length}</span>` : ''}</div>`;
      }
      if (hasDetail) {
        html += `<div class="p-detail">`;
        html += `<div class="p-detail-row"><span class="lbl">详细抓取：</span>`;
        html += `<span class="val ok">${escapeHtml(det.title || "").slice(0, 60)}</span></div>`;
        html += `<div class="p-detail-row">`;
        if (det.price != null) html += `<span><span class="lbl">价格</span> <span class="val">${det.currency || ''} ${det.price}</span></span>`;
        if (det.rating != null) html += `<span><span class="lbl">评分</span> <span class="val">${det.rating}</span></span>`;
        if (det.review_count) html += `<span><span class="lbl">评论</span> <span class="val">${det.review_count.toLocaleString()}</span></span>`;
        if (det.monthly_sales) html += `<span><span class="lbl">${escapeHtml(det.monthly_sales_window || "月销")}</span> <span class="val warn">${det.monthly_sales.toLocaleString()}</span></span>`;
        html += `</div>`;
        if (det.sizes && det.sizes.length) html += `<div class="p-detail-row"><span class="lbl">尺码</span> <span class="val">${det.sizes.map(escapeHtml).join(" / ")}</span></div>`;
        if (det.colors && det.colors.length) html += `<div class="p-detail-row"><span class="lbl">颜色</span> <span class="val">${det.colors.map(escapeHtml).join(" / ")}</span></div>`;
        html += `<div class="raw">后端: ${escapeHtml(det.fetch_backend || "")} · 抓取时间: ${formatTime(det.fetched_at)}</div>`;
        if (det.note) html += `<div class="raw" style="color:var(--amber)">${escapeHtml(det.note)}</div>`;
        html += `</div>`;
      } else if (det && !det.ok) {
        html += `<div class="p-detail"><span class="raw" style="color:var(--red)">详情抓取失败：${escapeHtml(det.error || "未知错误")}</span></div>`;
      }
      if (p.url) html += `<a class="p-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">查看商品 →</a>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  if (sec.note) html += `<div class="muted-note" style="margin-top:10px">${escapeHtml(sec.note)}</div>`;
  html += `</div>`;
  div.innerHTML = html;
  return div;
}

function formatTime(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toLocaleString("zh-CN", { hour12: false });
}

function renderInternal(sec) {
  const div = document.createElement("div");
  div.className = "section";
  let html = `<div class="section-head"><span class="badge internal">内部</span>${sec.title}<span style="margin-left:auto;font-size:11px;color:var(--muted-2)">${sec.source||""}</span></div>`;
  html += `<div class="section-body">`;
  if (sec.metrics && sec.metrics.length) {
    html += `<div class="metrics">${sec.metrics.map((m) => `<div class="metric-card"><div class="m-label">${escapeHtml(m.label)}</div><div class="m-value">${escapeHtml(m.value)}</div></div>`).join("")}</div>`;
  }
  if (sec.conclusion) html += `<div class="conclusion-text">${escapeHtml(sec.conclusion)}</div>`;
  if (sec.insights && sec.insights.length) {
    html += `<div class="muted-note">${sec.insights.map((i) => "⚠ " + escapeHtml(i)).join("<br>")}</div>`;
  }
  if (sec.chart && sec.chart.x_axis && sec.chart.series) {
    html += `<div class="chart-wrap" id="chart-${randId()}"></div>`;
  }
  if (sec.sql) {
    html += `<div class="sql-head">SQL（可审计）</div><div class="sql-block"><code>${escapeHtml(sec.sql)}</code></div>`;
  }
  if (sec.table && sec.table.columns && sec.table.columns.length) {
    html += `<div class="sql-head">数据明细（${sec.table.rows ? sec.table.rows.length : 0} 行）</div><div class="table-wrap">${renderTable(sec.table)}</div>`;
  }
  html += `</div>`;
  div.innerHTML = html;

  // 渲染图表
  if (sec.chart && sec.chart.x_axis && sec.chart.series && window.echarts) {
    const chartEl = div.querySelector(".chart-wrap");
    requestAnimationFrame(() => renderChart(chartEl, sec.chart_type, sec.chart));
  }
  return div;
}

function renderExternal(sec) {
  const div = document.createElement("div");
  div.className = "section";
  let html = `<div class="section-head"><span class="badge external">外部</span>${sec.title}<span style="margin-left:auto;font-size:11px;color:var(--muted-2)">互联网公开信息</span></div><div class="section-body">`;
  if (sec.summary) html += `<div class="conclusion-text">${escapeHtml(sec.summary)}</div>`;
  for (const s of sec.sources || []) {
    const cred = s.credibility === "高" ? "cred-high" : (s.credibility === "中" ? "cred-mid" : "");
    html += `<div class="src-card">
      <div class="src-title">${escapeHtml(s.title)}</div>
      <div class="src-meta"><span>来源：${escapeHtml(s.source)}</span><span>日期：${escapeHtml(s.published_time||"")}</span><span class="${cred}">可信度：${escapeHtml(s.credibility||"")}</span></div>
      <div class="src-summary">${escapeHtml(s.summary||"")}</div>
    </div>`;
  }
  html += `</div>`;
  div.innerHTML = html;
  return div;
}

function renderConclusion(sec) {
  const div = document.createElement("div");
  div.className = "section";
  let html = `<div class="section-head"><span class="badge conclusion">综合</span>${sec.title}</div><div class="section-body">`;
  html += `<div class="conclusion-text">${escapeHtml(sec.content||"")}</div>`;
  if (sec.uncertain && sec.uncertain.length) {
    html += `<div class="muted-note" style="margin-top:10px">${sec.uncertain.map((u) => `<span class="uncertain-tag">推测</span>${escapeHtml(u)}`).join("<br>")}</div>`;
  }
  html += `</div>`;
  div.innerHTML = html;
  return div;
}

function renderTable(tbl) {
  const cols = tbl.columns;
  const rows = (tbl.rows || []).slice(0, 30);
  let html = "<table><thead><tr>";
  for (const c of cols) html += `<th>${escapeHtml(c)}</th>`;
  html += "</tr></thead><tbody>";
  for (const r of rows) {
    html += "<tr>";
    for (const c of cols) html += `<td>${escapeHtml(r[c] ?? "")}</td>`;
    html += "</tr>";
  }
  html += "</tbody></table>";
  if ((tbl.rows || []).length > 30) html += `<div class="muted-note">仅展示前 30 行，共 ${tbl.rows.length} 行</div>`;
  return html;
}

function renderChart(el, type, chart) {
  const inst = echarts.init(el);
  currentChart = inst;
  const axisColor = "#5b6779";
  const textColor = "#8b98ab";
  const common = {
    tooltip: { trigger: "axis" },
    grid: { left: 50, right: 20, top: 30, bottom: 30 },
    xAxis: { type: "category", data: chart.x_axis, axisLine: { lineStyle: { color: axisColor } }, axisLabel: { color: textColor, rotate: chart.x_axis.length > 8 ? 30 : 0 } },
    yAxis: { type: "value", splitLine: { lineStyle: { color: "#1f2a3d" } }, axisLabel: { color: textColor } },
  };
  let option;
  if (type === "line") {
    option = { ...common, series: chart.series.map((s) => ({ name: s.name, type: "line", data: s.data, smooth: true, areaStyle: { opacity: .08 }, itemStyle: { color: "#38bdf8" }, lineStyle: { color: "#38bdf8" } })) };
  } else if (type === "pie") {
    option = { tooltip: { trigger: "item" }, series: [{ type: "pie", radius: ["40%","70%"], data: chart.x_axis.map((x,i) => ({ name: x, value: chart.series[0].data[i] })) }] };
  } else {
    option = { ...common, series: chart.series.map((s, i) => ({ name: s.name, type: "bar", data: s.data, itemStyle: { color: ["#38bdf8", "#818cf8", "#34d399", "#fbbf24", "#fb7185"][i % 5] } })) };
  }
  inst.setOption(option);
}

let _id = 0;
function randId() { return _id++; }

// 示例问题
async function loadSamples() {
  try {
    const resp = await fetch("/api/samples");
    const data = await resp.json();
    const wrap = $("#samples");
    wrap.innerHTML = "";
    for (const q of data.questions) {
      const b = document.createElement("button");
      b.className = "sample";
      b.textContent = q;
      b.onclick = () => { ask(q); $("#input").value = q; };
      wrap.appendChild(b);
    }
  } catch (_) {}
}

$("#sendBtn").onclick = () => {
  const q = $("#input").value.trim();
  if (!q) return;
  $("#input").value = "";
  ask(q);
};
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#sendBtn").click(); }
});

loadSamples();
</script>
